<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="剑网3普通版奇穴选择器。点选槽位，搭配与保存奇穴方案。">
  <title>剑网3 · 奇穴研习录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main" class="lab">
    <header class="heading"><h1>奇穴研习录 <span>剑网3 · 普通版</span></h1><button id="sources-button" class="text-button"><span id="version-label">等待数据</span> <span aria-hidden="true">ⓘ</span></button></header>
    <div id="storage-warning" class="warning" hidden></div>
    <div class="selector-row">
      <label for="school-filter">门派</label><select id="school-filter" aria-label="选择门派"><option value="">全部门派</option></select>
      <label for="spec-select">心法</label><select id="spec-select" aria-label="选择心法"></select>
      <span id="spec-role" class="role"></span>
      <span id="progress-label" class="progress-label">0 / 9</span>
    </div>
    <details id="data-warnings" class="data-warnings" hidden><summary>此心法的官方公告存在差异 <span>查看说明</span></summary><div id="data-warning-content"></div></details>
    <section id="slot-strip" class="slot-strip" aria-label="当前奇穴方案"></section>
    <div class="toolbar" aria-label="方案工具">
      <button id="save-plan">保存方案</button><button id="saved-button">我的方案 <span id="saved-count">0</span></button><span class="divider" aria-hidden="true"></span><button id="copy-plan">复制文字</button><button id="export-plan">导出</button><button id="import-plan">导入</button><button id="clear-plan">清空</button><span class="toolbar-hint">点槽选穴 · 悬停看说明</span>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
    <p id="empty-note" class="empty-note" hidden>官方数据尚未载入。请将 data.js 与 index.html 放在同一目录后重新打开。</p>
  </main>
  <section id="candidate-menu" class="candidate-menu" aria-label="选择奇穴" hidden>
    <div class="candidate-heading"><strong id="candidate-title"></strong><span id="candidate-count"></span><button id="close-candidates" class="close-button" aria-label="关闭候选">×</button></div>
    <div class="candidate-search"><input id="talent-search" type="search" aria-label="查找奇穴名称或效果" placeholder="查找本组奇穴" autocomplete="off"></div>
    <div id="candidate-list" class="candidate-list"></div>
    <p id="candidate-note" class="candidate-note"></p>
  </section>
  <aside id="talent-tooltip" class="talent-tooltip" role="tooltip" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="name-dialog"><form id="name-form"><div class="dialog-heading"><h2 id="name-dialog-title">保存方案</h2><button type="button" class="close-button" data-close="name-dialog" aria-label="关闭">×</button></div><label for="plan-name">方案名称</label><input id="plan-name" type="text" maxlength="80" required autocomplete="off"><p class="dialog-note" id="name-dialog-note">未选满也可以保存。方案保存在当前浏览器。</p><div class="dialog-actions"><button type="button" data-close="name-dialog">取消</button><button type="submit" class="primary-button">保存</button></div></form></dialog>
  <dialog id="saved-dialog"><div class="dialog-heading"><h2>我的方案</h2><button class="close-button" data-close="saved-dialog" aria-label="关闭">×</button></div><div id="saved-plans"></div><p class="dialog-note">本地记录随浏览器数据保存，可导出 JSON 备份。</p></dialog>
  <dialog id="sources-dialog"><div class="dialog-heading"><h2>版本与数据来源</h2><button class="close-button" data-close="sources-dialog" aria-label="关闭">×</button></div><div id="sources-content"></div></dialog>
  <dialog id="detail-dialog"><div class="dialog-heading"><h2>奇穴说明</h2><button class="close-button" data-close="detail-dialog" aria-label="关闭">×</button></div><div id="talent-detail"></div></dialog>
  <dialog id="delete-dialog"><form id="delete-form"><div class="dialog-heading"><h2>删除方案</h2><button type="button" class="close-button" data-close="delete-dialog" aria-label="关闭">×</button></div><p id="delete-message"></p><div class="dialog-actions"><button type="button" data-close="delete-dialog">取消</button><button type="submit" class="danger-button">删除</button></div></form></dialog>
  <script src="data.js"></script><script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
